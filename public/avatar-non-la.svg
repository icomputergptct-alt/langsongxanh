<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Nhân vật hoạt hình đội nón lá">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe9ff"/>
      <stop offset="1" stop-color="#7dd3a8"/>
    </linearGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe7a1"/>
      <stop offset="1" stop-color="#e0b860"/>
    </linearGradient>
    <clipPath id="circle"><circle cx="64" cy="64" r="64"/></clipPath>
  </defs>

  <g clip-path="url(#circle)">
    <rect width="128" height="128" fill="url(#bg)"/>

    <!-- shirt (áo bà ba) -->
    <path d="M22 128 C24 104 40 94 64 94 C88 94 104 104 106 128 Z" fill="#2f7fd1"/>
    <path d="M56 95 L64 108 L72 95 Z" fill="#f6c9a0"/>
    <circle cx="64" cy="114" r="2" fill="#1e5a9a"/>
    <circle cx="64" cy="122" r="2" fill="#1e5a9a"/>

    <!-- neck -->
    <rect x="57" y="84" width="14" height="14" rx="5" fill="#eab48a"/>

    <!-- hair at the back -->
    <path d="M38 62 C38 82 48 90 64 90 C80 90 90 82 90 62 Z" fill="#2b1d16"/>

    <!-- face -->
    <ellipse cx="64" cy="66" rx="23" ry="24" fill="#f6c9a0"/>
    <!-- ears -->
    <ellipse cx="41" cy="68" rx="4" ry="6" fill="#eab48a"/>
    <ellipse cx="87" cy="68" rx="4" ry="6" fill="#eab48a"/>

    <!-- fringe -->
    <path d="M42 58 C48 50 58 50 64 54 C70 50 80 50 86 58 C84 50 76 46 64 46 C52 46 44 50 42 58 Z" fill="#2b1d16"/>

    <!-- eyes -->
    <ellipse cx="55" cy="67" rx="3.2" ry="4" fill="#2b1d16"/>
    <ellipse cx="73" cy="67" rx="3.2" ry="4" fill="#2b1d16"/>
    <circle cx="56.2" cy="65.6" r="1.1" fill="#fff"/>
    <circle cx="74.2" cy="65.6" r="1.1" fill="#fff"/>
    <!-- brows -->
    <path d="M50 60 Q55 57.5 60 60" stroke="#2b1d16" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M68 60 Q73 57.5 78 60" stroke="#2b1d16" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- cheeks -->
    <ellipse cx="49" cy="76" rx="4.5" ry="2.8" fill="#f29a8a" opacity="0.7"/>
    <ellipse cx="79" cy="76" rx="4.5" ry="2.8" fill="#f29a8a" opacity="0.7"/>
    <!-- smile -->
    <path d="M57 78 Q64 85 71 78" stroke="#a3462f" stroke-width="2.4" fill="#fff" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- hat strap (quai nón) -->
    <path d="M40 57 Q37 90 64 93 Q91 90 88 57" stroke="#c0392b" stroke-width="2" fill="none"/>

    <!-- nón lá -->
    <path d="M64 6 L116 54 Q64 66 12 54 Z" fill="url(#hat)" stroke="#b8893a" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- rim shadow -->
    <path d="M12 54 Q64 66 116 54 Q64 62 12 54 Z" fill="#c99a45"/>
    <!-- ribs of the leaf hat -->
    <g stroke="#c99a45" stroke-width="1.2" fill="none" opacity="0.9">
      <path d="M22 45 Q64 52 106 45"/>
      <path d="M32 36 Q64 42 96 36"/>
      <path d="M42 27 Q64 32 86 27"/>
      <path d="M52 18 Q64 21 76 18"/>
    </g>
    <!-- highlight -->
    <path d="M64 10 L40 46" stroke="#fff6d0" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>
